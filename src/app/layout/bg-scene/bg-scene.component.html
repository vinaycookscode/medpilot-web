<div class="bg-scene">

  <!-- Stars -->
  <div class="bg-star" style="width:2px;height:2px;top:6%;left:8%;--d:2.1s"></div>
  <div class="bg-star" style="width:3px;height:3px;top:12%;left:22%;--d:2.8s;animation-delay:.4s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:4%;left:38%;--d:1.9s;animation-delay:.9s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:18%;left:52%;--d:3.2s;animation-delay:.2s"></div>
  <div class="bg-star" style="width:3px;height:3px;top:8%;left:65%;--d:2.4s;animation-delay:.7s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:14%;left:78%;--d:2s;animation-delay:1.1s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:5%;left:91%;--d:3s;animation-delay:.3s"></div>
  <div class="bg-star" style="width:3px;height:3px;top:22%;left:14%;--d:2.6s;animation-delay:.6s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:3%;left:47%;--d:1.7s;animation-delay:1.3s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:28%;left:84%;--d:2.9s;animation-delay:.5s"></div>
  <div class="bg-star" style="width:3px;height:3px;top:10%;left:58%;--d:2.2s;animation-delay:.8s"></div>
  <div class="bg-star" style="width:2px;height:2px;top:35%;left:3%;--d:3.1s;animation-delay:.1s"></div>

  <!-- Moon -->
  <div class="bg-moon"></div>

  <!-- Pulse beacon (top right area) -->
  <div class="bg-beacon">
    <div class="bg-beacon__ring" style="animation-delay:0s"></div>
    <div class="bg-beacon__ring" style="animation-delay:.7s"></div>
    <div class="bg-beacon__ring" style="animation-delay:1.4s"></div>
    <div class="bg-beacon__dot"></div>
  </div>

  <!-- ECG monitor (top left) -->
  <div class="bg-ecg">
    <div class="bg-ecg__label">♥ ECG</div>
    <svg class="bg-ecg__svg" viewBox="0 0 240 44" preserveAspectRatio="none">
      <polyline class="bg-ecg__line"
        points="0,22 20,22 26,22 30,6 34,38 38,22 48,22 56,22 60,14 62,22 68,22 90,22 94,6 98,38 102,22 108,22 112,14 114,22 120,22 142,22 146,6 150,38 154,22 160,22 164,14 166,22 172,22 194,22 198,6 202,38 206,22 212,22 216,14 218,22 224,22 240,22"/>
    </svg>
    <div class="bg-ecg__bpm">72 BPM</div>
  </div>

  <!-- Hospital building (center-right) -->
  <div class="bg-hospital">
    <div class="bg-hosp__roof"></div>
    <div class="bg-hosp__body">
      <div class="bg-hosp__cross">
        <div class="bg-hosp__cross-h"></div>
        <div class="bg-hosp__cross-v"></div>
      </div>
      <div class="bg-hosp__winrow">
        <div class="bg-win" style="--wd:3.2s"></div>
        <div class="bg-win" style="--wd:4.1s;animation-delay:.5s"></div>
        <div class="bg-win bg-win--off"></div>
        <div class="bg-win bg-win--blue"></div>
        <div class="bg-win" style="--wd:4.8s;animation-delay:1s"></div>
      </div>
      <div class="bg-hosp__winrow">
        <div class="bg-win" style="--wd:5.1s;animation-delay:.3s"></div>
        <div class="bg-win bg-win--off"></div>
        <div class="bg-win bg-win--off"></div>
        <div class="bg-win" style="--wd:3.9s;animation-delay:.8s"></div>
        <div class="bg-win bg-win--blue" style="--wd:6s;animation-delay:.2s"></div>
      </div>
      <div class="bg-hosp__winrow">
        <div class="bg-win bg-win--off"></div>
        <div class="bg-win" style="--wd:5.5s;animation-delay:1.2s"></div>
        <div class="bg-win" style="--wd:4.2s;animation-delay:.4s"></div>
        <div class="bg-win bg-win--off"></div>
        <div class="bg-win" style="--wd:3.5s;animation-delay:.9s"></div>
      </div>
      <div class="bg-hosp__entrance"></div>
    </div>
  </div>

  <!-- Trees -->
  <div class="bg-tree bg-tree--l">
    <div class="bg-tree__top2"></div>
    <div class="bg-tree__top"></div>
    <div class="bg-tree__trunk"></div>
  </div>
  <div class="bg-tree bg-tree--r">
    <div class="bg-tree__top2"></div>
    <div class="bg-tree__top"></div>
    <div class="bg-tree__trunk"></div>
  </div>

  <!-- Ground / Road -->
  <div class="bg-ground">
    <div class="bg-road">
      <div class="bg-road__line" style="left:5%"></div>
      <div class="bg-road__line" style="left:25%"></div>
      <div class="bg-road__line" style="left:45%"></div>
      <div class="bg-road__line" style="left:65%"></div>
      <div class="bg-road__line" style="left:85%"></div>
    </div>
  </div>

  <!-- Ambulance -->
  <div class="bg-ambulance">
    <div class="bg-ambu__lights">
      <div class="bg-ambu__light bg-ambu__light--red"></div>
      <div class="bg-ambu__light bg-ambu__light--blue"></div>
    </div>
    <div class="bg-ambu__body">
      <div class="bg-ambu__stripe">
        <div class="bg-ambu__cross-h"></div>
        <div class="bg-ambu__cross-v"></div>
      </div>
      <div class="bg-ambu__text">AMBULANCE</div>
      <div class="bg-ambu__window"></div>
    </div>
    <div class="bg-ambu__base"></div>
    <div class="bg-ambu__wheels">
      <div class="bg-wheel"></div>
      <div class="bg-wheel"></div>
    </div>
  </div>

  <!-- IV Drip -->
  <div class="bg-iv">
    <div class="bg-iv__bag"></div>
    <div class="bg-iv__tube"></div>
    <div class="bg-iv__drop"></div>
  </div>

  <!-- Floating medical particles -->
  <div class="bg-float" style="left:6%;bottom:35%;--fd:9s;animation-delay:0s">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="8" width="20" height="8" rx="4" fill="#ff4757" opacity=".7"/>
      <rect x="8" y="2" width="8" height="20" rx="4" fill="#ff4757" opacity=".7"/>
    </svg>
  </div>
  <div class="bg-float" style="left:88%;bottom:30%;--fd:10s;animation-delay:3s">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00cfff" stroke-width="2" opacity=".6">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
  </div>
  <div class="bg-float" style="left:15%;bottom:25%;--fd:11s;animation-delay:5s">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffd700" opacity=".5">
      <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/>
    </svg>
  </div>
  <div class="bg-float" style="left:75%;bottom:40%;--fd:8s;animation-delay:1.5s">
    <svg width="26" height="14" viewBox="0 0 40 20" opacity=".5">
      <rect width="40" height="20" rx="10" fill="#ff4757"/>
      <ellipse cx="12" cy="10" rx="8" ry="7" fill="rgba(255,255,255,.3)"/>
    </svg>
  </div>
  <div class="bg-float" style="left:45%;bottom:20%;--fd:12s;animation-delay:7s">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" opacity=".6">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
  </div>
  <div class="bg-float" style="left:58%;bottom:45%;--fd:7s;animation-delay:2s">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="2" opacity=".5">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  </div>

</div>
