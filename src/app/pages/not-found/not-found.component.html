<div class="not-found">
  <div class="not-found__card">
    <div class="not-found__halo">
      <div class="not-found__icon">
        <lucide-icon name="compass" [size]="32" />
      </div>
    </div>

    <div class="not-found__code">404</div>

    <h1 class="not-found__title">Page Not Found</h1>

    <p class="not-found__subtitle">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <div class="not-found__divider"></div>

    <p class="not-found__help">
      Double-check the URL, or use the sidebar to navigate to a section you have access to.
    </p>

    <div class="not-found__actions">
      <button class="btn btn--primary" (click)="goHome()">
        <lucide-icon name="layout-dashboard" [size]="15" />
        Back to Dashboard
      </button>
    </div>
  </div>
</div>
