<div class="sal-page">
  <div class="sal-card">

    <!-- Header -->
    <div class="sal-header">
      <div class="sal-header__icon">
        <lucide-icon name="shield-check" [size]="28" />
      </div>
      <h1>Super Admin Portal</h1>
      <p>Centralized configuration &amp; system management</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="sal-form">
      <gw-form-field label="Email address" [required]="true">
        <gw-input formControlName="email" type="email" autocomplete="username"
                  placeholder="super@super.com" />
      </gw-form-field>

      <gw-form-field label="Password" [required]="true">
        <gw-password-input formControlName="password" autocomplete="current-password"
                           placeholder="Enter password" />
      </gw-form-field>

      @if (errorMessage()) {
        <gw-alert variant="danger" [dismissible]="true" (dismiss)="errorMessage.set('')">
          {{ errorMessage() }}
        </gw-alert>
      }

      <gw-button variant="primary" size="lg" type="submit"
                 [block]="true" [loading]="loading()"
                 [disabled]="form.invalid">
        Sign in to Portal
      </gw-button>
    </form>

    <div class="sal-footer">
      <a href="/login">← Back to clinic login</a>
    </div>
  </div>

  <!-- Background decoration -->
  <div class="sal-bg">
    <div class="sal-bg__circle sal-bg__circle--1"></div>
    <div class="sal-bg__circle sal-bg__circle--2"></div>
    <div class="sal-bg__grid"></div>
  </div>
</div>
